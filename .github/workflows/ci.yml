# CI — 테스트·커버리지 게이트 (128회차)
# 왜: 지금까지 테스트는 사람이 deploy.bat 을 돌릴 때만 실행됐다. 로컬에서 건너뛰면
#     깨진 채로 push 될 수 있다. push·PR 마다 같은 게이트를 서버에서 다시 돌린다.
# 하는 일: 설치 → npm test(node --test) → 커버리지 게이트 → 백업 커버리지 점검.
# 하지 않는 일: 배포·DB 접속·시크릿 사용. 읽기 전용 검증만 한다(Vercel 배포는 별도).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: d-ars-repo/dars
    strategy:
      fail-fast: false
      # 로컬(개발자 PC)과 Vercel 런타임의 버전 차이를 함께 본다.
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: d-ars-repo/dars/package-lock.json

      # ci: package-lock.json 그대로 설치(해석 결과가 로컬과 달라지지 않는다)
      - name: install
        run: npm ci --no-audit --no-fund

      # scripts/run-tests.mjs — 셸 글롭에 의존하지 않고 tests/ 를 직접 읽는다
      - name: unit tests
        run: npm test

      - name: coverage gate
        run: npm run coverage:check

      # 스키마와 RUNBOOK 복구 대상 목록의 어긋남(리허설 미실시는 경고만 · 종료코드 0)
      - name: backup coverage
        run: npm run backup:check
