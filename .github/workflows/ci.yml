# CI — 테스트·커버리지·정책 게이트 (128회차 · 2026-09-09 보관파기/환경매트릭스 점검 추가)
# 왜: 지금까지 테스트는 사람이 deploy.bat 을 돌릴 때만 실행됐다. 로컬에서 건너뛰면
#     깨진 채로 push 될 수 있다. push·PR 마다 같은 게이트를 서버에서 다시 돌린다.
# 하는 일: 설치 → npm test(node --test) → 커버리지 게이트 → 백업 커버리지 → 개인정보 파기 정책 → 환경 매트릭스.
# 하지 않는 일: 배포·DB 접속·시크릿 사용. 읽기 전용 검증만 한다(Vercel 배포는 별도).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: d-ars-repo/dars
    # AICC-Core 는 별도(비공개) 저장소다. 토큰이 없으면 계약 검사는 **건너뛰며**,
    # 건너뛴 검사를 통과로 적지 않는다. 토큰 등록은 [승인 필요].
    env:
      AICC_CORE_TOKEN: ${{ secrets.AICC_CORE_TOKEN }}
    strategy:
      fail-fast: false
      # 로컬(개발자 PC)과 Vercel 런타임의 버전 차이를 함께 본다.
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: d-ars-repo/dars/package-lock.json

      # ci: package-lock.json 그대로 설치(해석 결과가 로컬과 달라지지 않는다)
      - name: install
        run: npm ci --no-audit --no-fund

      # scripts/run-tests.mjs — 셸 글롭에 의존하지 않고 tests/ 를 직접 읽는다
      - name: unit tests
        run: npm test

      - name: coverage gate
        run: npm run coverage:check

      # 스키마와 RUNBOOK 복구 대상 목록의 어긋남(리허설 미실시는 경고만 · 종료코드 0)
      - name: backup coverage
        run: npm run backup:check

      # 스키마의 개인정보 컬럼이 전부 파기 대상이거나 사유 있는 면제인지(DB 무접속·읽기 전용).
      # 미판단 컬럼이 생기면 실패한다 — 파기 누락은 조용히 지나가면 안 된다.
      - name: retention policy
        run: npm run retention:check

      # 코드가 읽는 환경변수와 등록부·문서 매트릭스의 어긋남(값은 출력하지 않는다).
      # 구성 미비(운영 값 미주입)는 사람의 승인 사항이라 실패로 보지 않는다.
      - name: env matrix
        run: npm run env:check

      # 감사 영속화가 "켜졌는데 남지 않는" 상태인지(DB 무접속·값 미출력).
      # CI 환경은 콘솔 모드가 기본이라 통과한다 — 운영 구성에서의 오설정을 잡는 게 목적이다.
      - name: audit persistence
        run: npm run audit:check

      # 발급 토큰 3종의 만료·1회용·서명 비밀 강도(값·길이 미출력 · 토큰 발급 없음).
      - name: token security
        run: npm run token:check

      # ── AICC-Core 채널 계약(§5.3) ────────────────────────────────────────
      # D-ARS 가 Core 를 실제로 소비하므로, Core 의 적합성 스위트를 이 저장소 포트에 대고 돌린다.
      # 드라이런 전용이라 고객 화면으로 아무것도 나가지 않는다(ci/aicc-port.mjs 는 transport 미주입).
      - name: AICC-Core 체크아웃 (채널 계약 검사용)
        id: aicc_core
        if: env.AICC_CORE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: AI-JUNE/aicc-core
          path: .aicc-core
          token: ${{ secrets.AICC_CORE_TOKEN }}

      - name: 채널 계약 적합성 (드라이런 · 종료코드 0/1/2 그대로 게이트)
        if: steps.aicc_core.outcome == 'success'
        run: npm run conformance:aicc
        env:
          # checkout 은 워크스페이스 루트 기준, 실행은 d-ars-repo/dars 기준이다.
          AICC_CORE: ../../.aicc-core
